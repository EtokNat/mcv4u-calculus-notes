name: check-unlock

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium
      - env:
          BRONSTON_USER: ${{ secrets.BRONSTON_USER }}
          BRONSTON_PASS: ${{ secrets.BRONSTON_PASS }}
          OUT_ROOT: ${{ github.workspace }}/unlock_check
        run: python scripts/canvas_scrape/check_unlock.py 2>&1 | tee check.log
      - if: always()
        run: tar czf unlock_check.tgz unlock_check/ check.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unlock_check
          path: |
            unlock_check.tgz
            check.log
          retention-days: 7
