name: Scrape Bronston MCV4U

on:
  workflow_dispatch:
    inputs:
      only_module:
        description: "Canvas module id (blank = all 9 units)"
        required: false
        default: ""
      stop_at:
        description: "Stop after N items (blank = no limit)"
        required: false
        default: ""

concurrency:
  group: canvas-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright requests
          python -m playwright install --with-deps chromium

      - name: Run MCV4U unlocker
        env:
          BRONSTON_USER: ${{ secrets.BRONSTON_USER }}
          BRONSTON_PASS: ${{ secrets.BRONSTON_PASS }}
          ONLY_MODULE: ${{ inputs.only_module }}
          STOP_AT: ${{ inputs.stop_at }}
        run: |
          python scripts/canvas_scrape/unlock_mcv4u.py 2>&1 | tee unlock.log || true
          # Always proceed to artifact upload, even if the script errors late.

      - name: Package scrape
        if: always()
        run: |
          tar czf mcv4u_scrape.tgz mcv4u_scrape/ unlock.log || true
          ls -la mcv4u_scrape.tgz || true

      - name: Upload scrape as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcv4u-canvas-scrape
          path: |
            mcv4u_scrape.tgz
            unlock.log
          if-no-files-found: warn
          retention-days: 14

      - name: Create release with scrape tarball
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="canvas-scrape-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" mcv4u_scrape.tgz unlock.log \
            --title "Canvas scrape $TAG" \
            --notes "Autogenerated by scrape-canvas.yml" || true
