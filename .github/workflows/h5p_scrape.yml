name: h5p-scrape

on:
  workflow_dispatch:
    inputs:
      only_id:
        description: "Single assignment id (blank = all)"
        required: false
        default: ""
      stop_at:
        description: "Stop after N assignments (blank = no limit)"
        required: false
        default: ""
      frame_wait_ms:
        description: "Wait ms for H5P iframe to load"
        required: false
        default: "12000"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium
      - name: Run H5P scraper
        env:
          BRONSTON_USER: ${{ secrets.BRONSTON_USER }}
          BRONSTON_PASS: ${{ secrets.BRONSTON_PASS }}
          OUT_ROOT: ${{ github.workspace }}/h5p_frames
          ONLY_ID: ${{ inputs.only_id }}
          STOP_AT: ${{ inputs.stop_at }}
          FRAME_WAIT_MS: ${{ inputs.frame_wait_ms }}
        run: |
          python scripts/canvas_scrape/scrape_h5p_frames.py 2>&1 | tee h5p_scrape.log
        continue-on-error: true
      - name: Package
        if: always()
        run: tar czf h5p_frames.tgz h5p_frames/ h5p_scrape.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h5p_frames
          path: |
            h5p_frames.tgz
            h5p_scrape.log
          retention-days: 7
          if-no-files-found: warn
