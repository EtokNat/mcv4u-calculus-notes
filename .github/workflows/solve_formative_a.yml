name: solve-formative-a

on:
  workflow_dispatch:
    inputs:
      max_attempts:
        description: "Max attempts"
        default: "8"
      aid:
        description: "Assignment id (default 14503 = Formative Check A)"
        default: "14503"
      mid:
        description: "Module item id (default 32373)"
        default: "32373"

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright sympy
          python -m playwright install chromium
          python -m playwright install-deps chromium
      - name: Solve + Submit loop
        env:
          BRONSTON_USER: ${{ secrets.BRONSTON_USER }}
          BRONSTON_PASS: ${{ secrets.BRONSTON_PASS }}
          OUT_ROOT: ${{ github.workspace }}/submit_fa
          MAX_ATTEMPTS: ${{ inputs.max_attempts }}
          AID: ${{ inputs.aid }}
          MID: ${{ inputs.mid }}
        run: |
          python scripts/canvas_scrape/solve_submit_formative_a.py 2>&1 | tee submit_fa.log
        continue-on-error: true
      - name: Package
        if: always()
        run: tar czf submit_fa.tgz submit_fa/ submit_fa.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: submit_fa
          path: |
            submit_fa.tgz
            submit_fa.log
          retention-days: 7
          if-no-files-found: warn
